spring:
  application:
    name: TramityRH
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB


server:
  port: ${PORT:8080}

tramity:
  jwt:
    secret: ${JWT_SECRET}
    expiracao-horas: 8
  arquivos:
    diretorio: ${ARQUIVOS_DIR:arquivos}

